name: Dagelijkse update

on:
  schedule:
    - cron: "17 5 * * *" # elke dag rond 07:17 Belgische tijd
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: legendcars-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Websites doorzoeken en dashboard bouwen
        run: python -m legendcars update
      - name: Resultaten bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update advertenties $(date -u +%F)"
            git push
          fi
