name: Dagelijkse update

on:
  schedule:
    - cron: "17 5 * * *" # elke dag rond 07:17 Belgische tijd
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: legendcars-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Websites doorzoeken en dashboard bouwen
        run: python -m legendcars update
      - name: Resultaten bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update advertenties $(date -u +%F)"
            # Iemand anders kan intussen code gepusht hebben: eerst bijwerken, dan pushen
            git pull --rebase origin main
            python -m legendcars build
            git add docs
            git diff --cached --quiet || git commit -m "Dashboard opnieuw gebouwd"
            git push
          fi
      - name: Melding nieuwe topkansen
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          n=$(node legendcars/alerts.mjs docs/index.html "$RUNNER_TEMP")
          echo "Kansen vandaag: $n"
          if [ "$n" -gt 0 ]; then
            gh label create topkansen --color 0E5A43 --description "Dagelijkse melding van LegendCars" --force
            for old in $(gh issue list --label topkansen --state open --json number --jq '.[].number'); do
              gh issue close "$old" --comment "Vervangen door de melding van vandaag."
            done
            if [ "$n" -eq 1 ]; then titel="1 nieuwe kans"; else titel="$n nieuwe kansen"; fi
            gh issue create --title "🚗 $titel – $(date -u +%d/%m/%Y)" --body-file "$RUNNER_TEMP/alerts.md" --label topkansen
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" -d disable_web_page_preview=true \
                --data-urlencode text@"$RUNNER_TEMP/alerts.txt" > /dev/null
            fi
          fi
