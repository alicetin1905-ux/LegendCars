name: Dagelijkse update

on:
  schedule:
    # Start 08:40 Belgische tijd, melding rond 09:00. GitHub rekent in UTC; de stap
    # "Juiste tijd?" laat enkel de run door die bij de huidige zomer/wintertijd hoort.
    - cron: "40 6 * * *" # 08:40 zomertijd (CEST, UTC+2)
    - cron: "40 7 * * *" # 08:40 wintertijd (CET, UTC+1)
    # Back-up om 11:00: draait enkel als GitHub de run van 08:40 heeft overgeslagen.
    - cron: "0 9 * * *" # 11:00 zomertijd
    - cron: "0 10 * * *" # 11:00 wintertijd
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: legendcars-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Juiste tijd?
        id: tijd
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Brussels date +%z)
          today=$(TZ=Europe/Brussels date +%F)
          al_gedaan=false
          if grep -q "\"last_seen\": \"$today\"" data/listings.jsonl; then al_gedaan=true; fi
          case "$SCHEDULE" in
            "")           run=true ;;                                     # handmatig gestart
            "40 6 * * *") [ "$offset" = "+0200" ] && run=true || run=false ;;
            "40 7 * * *") [ "$offset" = "+0100" ] && run=true || run=false ;;
            "0 9 * * *")  [ "$offset" = "+0200" ] && [ "$al_gedaan" = false ] && run=true || run=false ;;
            "0 10 * * *") [ "$offset" = "+0100" ] && [ "$al_gedaan" = false ] && run=true || run=false ;;
            *)            run=false ;;
          esac
          echo "Brussel: $(TZ=Europe/Brussels date '+%F %H:%M %Z'), schema '$SCHEDULE', vandaag al bijgewerkt: $al_gedaan -> uitvoeren: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.tijd.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Tests
        if: steps.tijd.outputs.run == 'true'
        run: python -m unittest discover -s tests -t .
      - name: Websites doorzoeken en dashboard bouwen
        if: steps.tijd.outputs.run == 'true'
        run: python -m legendcars update
      - name: Resultaten bewaren
        if: steps.tijd.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update advertenties $(date -u +%F)"
            # Iemand anders kan intussen code gepusht hebben: eerst bijwerken, dan pushen
            git pull --rebase origin main
            python -m legendcars build
            git add docs
            git diff --cached --quiet || git commit -m "Dashboard opnieuw gebouwd"
            git push
          fi
      - name: Melding nieuwe topkansen
        if: steps.tijd.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          n=$(node legendcars/alerts.mjs docs/index.html "$RUNNER_TEMP")
          echo "Kansen vandaag: $n"
          if [ "$n" -gt 0 ]; then
            gh label create topkansen --color 0E5A43 --description "Dagelijkse melding van LegendCars" --force
            for old in $(gh issue list --label topkansen --state open --json number --jq '.[].number'); do
              gh issue close "$old" --comment "Vervangen door de melding van vandaag."
            done
            if [ "$n" -eq 1 ]; then titel="1 nieuwe kans"; else titel="$n nieuwe kansen"; fi
            gh issue create --title "🚗 $titel – $(date -u +%d/%m/%Y)" --body-file "$RUNNER_TEMP/alerts.md" --label topkansen
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" -d disable_web_page_preview=true \
                --data-urlencode text@"$RUNNER_TEMP/alerts.txt" > /dev/null
            fi
          fi
