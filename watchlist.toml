# LegendCars — Oldtimer collection watchlist
#
# Elk [[model]] blok is één zoekfilter. Velden:
#   years          bouwjaar van/tot (eerste inschrijving)
#   trend          verwachte jaarlijkse waardestijging in % voor een goed exemplaar
#                  (startwaarde/inschatting; wordt bijgestuurd met eigen prijshistoriek)
#   rarity         zeldzaamheid 1-5
#   demand         vraag bij liefhebbers 1-5
#   manual_premium true = manuele bak is gezocht, automaat drukt de waarde
#   keywords       regex(en) die in titel/omschrijving MOETEN voorkomen (alle bronnen)
#   text_keywords  extra verplichte regex(en) enkel voor vrije-tekst-sites (2dehands/Marktplaats)
#   exclude        regex(en) die een advertentie uitsluiten
#   body           toegelaten carrosserie op 2dehands/Marktplaats ("cabrio", "coupe")
#   variants       uitvoeringen die extra (of minder) waardestijging geven; bonus in %-punt per jaar
#   as24           AutoScout24-zoekopdrachten (make/model/line id's, body: 2=cabrio 3=coupé)
#   query          zoektermen voor 2dehands.be en Marktplaats.nl
#
# Alle regex'en werken op tekst in kleine letters, zonder accenten, waarbij leestekens
# vervangen zijn door spaties (punt tussen cijfers blijft: "2.8", "3.0").

[settings]
# Websites die doorzocht worden
sources = ["autoscout24", "2dehands", "marktplaats", "kleinanzeigen"]
# Bouwjaar tot en met (filter bij het zoeken; modellen die pas later begonnen worden overgeslagen)
max_year = 1999
# AutoScout24 landen: A=Oostenrijk B=België D=Duitsland E=Spanje F=Frankrijk I=Italië L=Luxemburg NL=Nederland
as24_countries = ["B", "NL", "D", "L", "F", "A", "I", "E"]
as24_max_pages = 20
adevinta_max_pages = 3
kleinanzeigen_max_pages = 6
request_delay = 1.2
min_price = 1000
# Woorden in de titel die op een zoekertje/onderdeel wijzen i.p.v. een te koop staande auto
title_exclude = [
  "gezocht", "gevraagd", "\\binkoop\\b", "wij kopen", "ik zoek", "\\bzoek\\b", "onderdelen", "\\bparts\\b",
  "miniatuur", "modelauto", "schaalmodel", "\\b1 18\\b", "\\b1 43\\b", "\\b1 24\\b", "brochure", "folder",
  "^velgen", "^motorblok", "^plaatwerk",
  "\\bsuche\\b", "\\bankauf\\b", "\\bkaufe\\b", "ersatzteil", "ausschlacht", "schlachtfest", "^teile\\b",
]
# Woorden die een risico aangeven (geen uitsluiting, wel lagere betrouwbaarheid)
risk_flags = [
  { match = "project|opknapper|restauratie|restoration|restauratieproject|bastler|scheunenfund|restaurationsobjekt", label = "Project/restauratie" },
  { match = "schade|ongeval|accident|hagel|unfall", label = "Schade" },
  { match = "defect|defekt|motor kapot|motorschade|start niet|rijdt niet|getriebeschaden|springt nicht an", label = "Defect" },
  { match = "zonder papieren|geen papieren|no papers|sans papiers|ohne papiere|ohne brief", label = "Geen papieren" },
  { match = "\\blpg\\b", label = "LPG" },
  { match = "export|marchand|handelaar", label = "Export/handelaar" },
]

[dashboard]
# Standaardfilters (aanpasbaar in de pagina). Er wordt breder gezocht zodat de marktwaarde klopt.
price_min = 2500
price_max = 9999
max_km = 250000
# Standaardwaarden voor de kostencalculator in het dashboard (allemaal aanpasbaar in de pagina)
horizon_years = 5
storage_per_month = 60      # stalling
insurance_per_year = 180    # oldtimerverzekering
tax_per_year = 50           # verkeersbelasting (BE O-plaat ~ forfait)
maintenance_per_year = 400  # onderhoud tijdens stockage
buy_costs = 500             # transport, keuring, inschrijving
sell_pct = 5                # verkoopkosten in % (veiling/commissie/advertentie)
deal_credit = 50            # % van het verschil tussen marktwaarde en vraagprijs dat je meetelt bij een koopje

